name: release

# Push a tag like v1.4 to build, sign and publish lg-remote.apk as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # VERSION_CODE counts commits
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null
      # Same key as earlier builds, so updates install over the existing app.
      - run: echo "$KEYSTORE_BASE64" | base64 -d > debug.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: VERSION="${GITHUB_REF_NAME#v}" VERSION_CODE="$(git rev-list --count HEAD)" ./build.sh
      - run: |
          mv lg-remote.apk "thumb-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "thumb-$GITHUB_REF_NAME.apk" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
